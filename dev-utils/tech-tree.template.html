<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>civ5-refined · Дерево технологий</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10171e;color:#e6edf1}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}header{padding:20px 26px 14px;border-bottom:1px solid #34424f;background:#17222c}h1{font-size:24px;font-weight:650;margin:0 0 7px}p{margin:0;color:#a8bac7;font-size:13px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}input,button,select{font:inherit;color:inherit;border:1px solid #465867;background:#1d2c38;border-radius:6px;padding:8px 10px}input{width:245px}button{cursor:pointer}button:hover{background:#314657}label{font-size:13px}#zoom{width:100px;padding:0}main{display:flex;flex:1;min-height:0}#viewport{overflow:auto;flex:1;position:relative;background:#10171e}#canvas{position:relative;transform-origin:0 0;overflow:hidden;flex-shrink:0}#world{position:relative}svg{position:absolute;inset:0;pointer-events:none}.edge{fill:none;stroke:#546875;stroke-width:2;opacity:.65}.edge.new{stroke:#d5aa60;stroke-dasharray:7 4}.edge.active{stroke:#65d7dc;stroke-width:3;opacity:1}.edge.dim{opacity:.08}.card{position:absolute;width:184px;height:84px;border:1px solid #4b6172;border-radius:8px;background:#1c2b37;text-align:left;padding:9px 11px;color:#eff5f8;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.card strong{font-size:13px;font-weight:600;line-height:1.2}.card small{font-size:11px;color:#aabcc9}.card.new{border-color:#d5aa60;background:#342d22}.card.changed{border-left:4px solid #d5aa60}.card.selected{outline:3px solid #65d7dc}.card.related{border-color:#65d7dc}.card.dim{opacity:.18}.card.match{outline:2px solid #fff}.era{position:absolute;top:0;height:1170px;border-left:1px solid #33414d;background:#ffffff03;pointer-events:none}.era b{position:absolute;top:18px;left:14px;font-size:14px;white-space:nowrap;color:#a6bac9}.era:nth-child(even){background:#ffffff06}aside{width:310px;flex-shrink:0;padding:22px;overflow:auto;border-left:1px solid #34424f;background:#17222c}aside h2{font-size:21px;margin:0 0 12px}aside h3{font-size:13px;color:#a8bac7;margin:22px 0 8px}aside p{line-height:1.6}aside button{display:block;width:100%;text-align:left;margin:5px 0;font-size:13px}code{font-size:10px;overflow-wrap:anywhere;color:#8ca8bb}.badge{display:inline-block;background:#473c29;color:#f0c982;padding:4px 7px;border-radius:4px;font-size:12px;margin-bottom:12px}.legend{display:flex;gap:15px;font-size:12px;color:#afc0ca;margin-top:12px}.legend span::before{content:'■';margin-right:6px;color:#526e81}.legend .gold::before{color:#d5aa60}.legend .cyan::before{color:#65d7dc}#status{margin-left:auto;font-size:12px;color:#b0c0ca}@media(max-width:850px){aside{width:250px}header{padding:14px}main{min-height:0}}
</style>
<header><h1>Дерево технологий <span style="color:#d5aa60">civ5-refined</span></h1>
<p>Полное дерево BNW с текущими SQL-правками · координаты GridX / GridY · все входящие зависимости обязательны</p>
<nav><input id="search" type="search" placeholder="Найти технологию…" aria-label="Поиск технологии"><button id="prev" aria-label="Предыдущий результат">←</button><button id="next" aria-label="Следующий результат">→</button><label>Масштаб <input id="zoom" type="range" min="10" max="150" value="80"> <span id="pct">80%</span></label><button id="fit">Всё дерево</button><button id="reset">Сбросить выбор</button><span id="status"></span></nav>
<div class="legend"><span>BNW</span><span class="gold">Новая технология / изменённые требования</span><span class="cyan">Выбранная ветка</span><span>Пунктир — новая связь</span></div></header>
<main><div id="viewport" tabindex="0" aria-label="Дерево технологий, прокрутка по горизонтали и вертикали"><div id="canvas"><div id="world"></div></div></div><aside id="detail"></aside></main>
<script>
const DATA=__TREE_DATA__;
const eras={ERA_ANCIENT:'Древний мир',ERA_CLASSICAL:'Античность',ERA_MEDIEVAL:'Средневековье',ERA_RENAISSANCE:'Возрождение',ERA_INDUSTRIAL:'Промышленная эпоха',ERA_MODERN:'Новейшее время',ERA_POSTMODERN:'Атомная эра',ERA_FUTURE:'Информационная эра'};
const W=246,H=108,DX=28,DY=76,width=(Math.max(...DATA.nodes.map(n=>n.x))+1)*W+30,height=1170;
const world=document.getElementById('world'),canvas=document.getElementById('canvas'),viewport=document.getElementById('viewport'),detail=document.getElementById('detail');
const byId=new Map(DATA.nodes.map(n=>[n.id,n])),cards=new Map(),paths=[];let selected=null,matches=[],matchIndex=-1;
world.style.width=width+'px';world.style.height=height+'px';
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
for(const era of [...new Set(DATA.nodes.map(n=>n.era))]){const group=DATA.nodes.filter(n=>n.era===era),left=Math.min(...group.map(n=>n.x))*W;const e=el('div','era');e.style.left=left+'px';e.style.width=(Math.max(...group.map(n=>n.x))*W-left+W)+'px';e.append(el('b','',eras[era]||era));world.append(e)}
const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('width',width);svg.setAttribute('height',height);svg.setAttribute('aria-hidden','true');world.append(svg);
for(const edge of DATA.edges){const a=byId.get(edge.source),b=byId.get(edge.target),x=a.x*W+DX+184,y=a.y*H+DY+42,tx=b.x*W+DX,ty=b.y*H+DY+42;
const p=document.createElementNS(ns,'path');p.setAttribute('d',`M${x},${y} H${tx-28} Q${tx-16},${y} ${tx-16},${y+(ty>y?12:ty<y?-12:0)} V${ty+(ty>y?-12:ty<y?12:0)} Q${tx-16},${ty} ${tx-4},${ty} H${tx}`);p.setAttribute('class','edge'+(edge.new?' new':''));svg.append(p);paths.push([edge,p])}
for(const n of DATA.nodes){const b=el('button','card'+(n.new?' new':'')+(n.changed?' changed':''));b.style.left=n.x*W+DX+'px';b.style.top=n.y*H+DY+'px';b.title=n.name;b.append(el('strong','',n.name),el('small','',`${n.cost.toLocaleString('ru')} науки${n.new?' · НОВАЯ':n.changed?' · Δ связи':''}`));b.onclick=()=>select(n.id);world.append(b);cards.set(n.id,b)}
function reach(id,backward){const seen=new Set([id]),todo=[id];while(todo.length){const curr=todo.pop();for(const e of DATA.edges){if((backward?e.target:e.source)===curr){const next=backward?e.source:e.target;if(!seen.has(next)){seen.add(next);todo.push(next)}}}}return seen}
function jump(id){select(id);const n=byId.get(id),s=+document.getElementById('zoom').value/100;viewport.scrollTo({left:(n.x*W+DX)*s-viewport.clientWidth/2+92*s,top:(n.y*H+DY)*s-viewport.clientHeight/2+42*s,behavior:'smooth'})}
function links(title,ids){detail.append(el('h3','',title));if(!ids.length){detail.append(el('p','','Нет'));return}for(const id of ids){const b=el('button','',byId.get(id).name);b.onclick=()=>jump(id);detail.append(b)}}
function select(id){selected=id;const related=id?new Set([...reach(id,true),...reach(id,false)]):new Set();for(const [key,c] of cards){c.classList.toggle('selected',key===id);c.classList.toggle('related',!!id&&related.has(key));c.classList.toggle('dim',!!id&&!related.has(key))}for(const[e,p]of paths){const on=related.has(e.source)&&related.has(e.target);p.classList.toggle('active',!!id&&on);p.classList.toggle('dim',!!id&&!on)}detail.replaceChildren();if(!id){detail.append(el('h2','','От земледелия к будущему'),el('p','',`${DATA.nodes.length} технологий · ${DATA.edges.length} зависимостей`),el('h3','','Как читать'),el('p','','Нажмите технологию: подсветятся все её предпосылки и дальнейшие исследования. Поиск находит русское название и Type; стрелки переходят между результатами.'),el('h3','','Данные'),el('p','',DATA.sourceMode+' + SQL текущего мода. Схема показывает зависимости и стоимость, а не полный набор открываемого контента. Стоимость указана до игровых модификаторов.'),el('h3','','Статус проверки'),el('p','','Сгенерировано из данных вне игры. Геометрия линий здесь схематическая; это не снимок штатного TechTree BNW.'));return}const n=byId.get(id);detail.append(el('h2','',n.name));if(n.new||n.changed)detail.append(el('span','badge',n.new?'Добавлено модом':'Изменены зависимости'));detail.append(el('p','',`${eras[n.era]} · ${n.cost.toLocaleString('ru')} науки`),el('code','',n.id));if(n.help)detail.append(el('h3','','Эффект мода'),el('p','',n.help.replace(/\[NEWLINE\]/g,'\n').replace(/\[[^\]]+\]/g,'')));links('Требуется изучить всё',n.parents);links('Открывает исследования',DATA.edges.filter(e=>e.source===id).map(e=>e.target));if(n.removed.length)links('Больше не требуется напрямую',n.removed);detail.append(el('h3','','Позиция в игре'),el('p','',`GridX ${n.x} · GridY ${n.y}${n.moved?' · перемещена относительно BNW':''}`))}
function scale(){const s=+document.getElementById('zoom').value/100;world.style.transform=`scale(${s})`;world.style.transformOrigin='0 0';canvas.style.width=width*s+'px';canvas.style.height=height*s+'px';document.getElementById('pct').textContent=Math.round(s*100)+'%'}
document.getElementById('zoom').oninput=scale;document.getElementById('fit').onclick=()=>{document.getElementById('zoom').value=Math.max(10,Math.floor(Math.min(viewport.clientWidth/width,viewport.clientHeight/height)*100));scale();viewport.scrollTo(0,0)};
document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';search();select(null)};
function search(){const q=document.getElementById('search').value.trim().toLocaleLowerCase();matches=DATA.nodes.filter(n=>q&&(n.name+' '+n.id).toLocaleLowerCase().includes(q)).map(n=>n.id);for(const[id,c]of cards)c.classList.toggle('match',matches.includes(id));matchIndex=-1;document.getElementById('status').textContent=q?`Найдено: ${matches.length}`:`${DATA.nodes.length} технологий · ${DATA.nodes.filter(n=>n.new).length} новых`;if(matches.length===1)jump(matches[0])}
function next(dir){if(!matches.length)return;matchIndex=(matchIndex+dir+matches.length)%matches.length;jump(matches[matchIndex])}document.getElementById('search').oninput=search;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')next(1)};document.getElementById('prev').onclick=()=>next(-1);document.getElementById('next').onclick=()=>next(1);scale();search();select(null);
</script></html>
