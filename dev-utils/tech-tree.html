function reach(id,backward){const seen=new Set([id]),todo=[id];while(todo.length){const curr=todo.pop();for(const e of DATA.edges){if((backward?e.target:e.source)===curr){const next=backward?e.source:e.target;if(!seen.has(next)){seen.add(next);todo.push(next)}}}}return seen}
