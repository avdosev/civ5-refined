name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from tools.build import VERSION
          expected = f'v{VERSION}'
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Tag {actual!r} must be {expected!r} according to VERSION')
          PY
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Validate SQL, technology tree and build package
        run: python tests/validate.py
      - name: Validate Lua behavior
        run: python tests/run_lua.py --lua lua5.1
      - name: Validate allies and institutions
        run: python tests/society.py --lua lua5.1
      - uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-package
          path: dist
      - name: Publish prototype prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Прототип для Civilization V: Brave New World.

          Установка: скачайте приложенный ZIP civ5-refined, распакуйте и скопируйте папку мода целиком в пользовательский каталог MODS. Включите мод и начните новую одиночную партию через меню модов. Предыдущую версию отключите. Автоматические архивы Source code содержат исходники, а не установочный пакет.

          Проверки CI: SQL на представительном тестовом наборе BNW, зависимости и раскладка технологий, локализация, манифест и контрольные суммы пакета, поведенческие проверки Lua 5.1 с моделью игрового API.

          CI не запускает Civilization V. Полная игровая БД, интерфейс, реальные события и баланс требуют отдельной проверки в игре. Результат игровой пробы указывается вручную в описании релиза; успешный CI сам по себе её не подтверждает.
          EOF
          gh release create "$RELEASE_TAG" dist/*.zip \
            --verify-tag --prerelease --latest=false \
            --title "civ5-refined $RELEASE_TAG — Prototype" \
            --notes-file release-notes.md --generate-notes
